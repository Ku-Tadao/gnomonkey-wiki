site_name: GnomonkeyRS Wiki
site_url: https://ku-tadao.github.io/gnomonkey-wiki/
repo_url: https://github.com/Ku-Tadao/gnomonkey-wiki
theme:
  name: material
  palette:
    primary: brown
    accent: amber
  features:
    - navigation.top
    - search.suggest
    - search.highlight
extra_css:
  - css/osrs.css
markdown_extensions:
  - tables
  - footnotes
  - md_in_html
  - toc:
      toc_depth: "2-3"
      title: Contents
nav:
  - Home: index.md
  - Topics: topics.md
  - Videos: videos/index.md
validation:
  links:
    unrecognized_links: warn
